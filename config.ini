[settings]
# See "Location (or type)" and "Language ID":
# https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-lcid/a9eac961-e77d-41a6-90a5-ce1a8b0cdb9c
#

layout check interval = 0.5
# Check keyboard layout every this value seconds.
# Is used when window is changed and language also changed but not by our hotkey

layout switching = FLU
# Cyclically switch through installed layouts (CKL) or switch between first and last used layout (FLU).

key press timeout = 0.5
# If a key was pressed longer than this value in seconds, then do not change the keyboard layout.

[hotkeys]
# Key names are accepted by keyboard.on_release_key, such as "ctrl", "right ctrl", or "right shift".
# Leave a layout empty to use the next installed layout when the key is released.
ctrl =
shift = 0x0422
right shift = 0x0415
right ctrl = 0x409
# 0x422 = Ukrainian
# 0x0415 = Polish
# 0x409 = United States
